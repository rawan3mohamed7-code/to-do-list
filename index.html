<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام الاحترافية | To-Do List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
        
        <!-- رأس التطبيق -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-orange-500 mb-1">قائمة مهامي اليومية</h1>
            <p class="text-slate-400 text-sm">نظمي وقتك وحققي أهدافك بكل إبداع</p>
        </div>

        <!-- خانة الإدخال وزر الإضافة -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="taskInput" placeholder="أضيفي مهمة جديدة هنا..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-orange-500 transition-all">
            <button onclick="addTask()" 
                class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-5 py-3 rounded-xl transition-all shadow-lg shadow-orange-500/2anchen flex items-center justify-center">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- عداد المهام -->
        <div class="flex justify-between items-center text-xs text-slate-400 mb-4 px-1">
            <span>إجمالي المهام: <span id="totalTasks" class="text-white font-bold">0</span></span>
            <span>المنجزة: <span id="completedTasks" class="text-green-400 font-bold">0</span></span>
        </div>

        <!-- قائمة المهام -->
        <ul id="taskList" class="space-y-3 max-h-72 overflow-y-auto pr-1">
            <!-- سيتم إضافة المهام هنا برمجياً -->
        </ul>

        <!-- رسالة لو القائمة فاضية -->
        <div id="emptyMessage" class="text-center py-8 text-slate-500 text-sm">
            <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>
            لا توجد مهام حالياً، أضيفي مهمتك الأولى!
        </div>

    </div>

    <!-- كود الـ JavaScript للتشغيل -->
    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const totalTasksSpan = document.getElementById('totalTasks');
        const completedTasksSpan = document.getElementById('completedTasks');
        const emptyMessage = document.getElementById('emptyMessage');

        // جلب المهام المخزنة مسبقاً أو مصفوفة فارغة
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // عرض المهام أول ما الصفحة تفتح
        renderTasks();

        // إضافة مهمة جديدة
        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === "") {
                alert('من فضلك اكتبي اسم المهمة أولاً!');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: taskText,
                completed: false
            };

            tasks.push(newTask);
            saveAndRender();
            taskInput.value = "";
        }

        // إمكانية الإضافة بزر Enter من لوحة المفاتيح
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // تبديل حالة المهمة (منجزة / غير منجزة)
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveAndRender();
        }

        // حذف مهمة
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveAndRender();
        }

        // حفظ في LocalStorage وتحديث الواجهة
        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // رسم وترتيب المهام على الشاشة
        function renderTasks() {
            taskList.innerHTML = "";
            
            if (tasks.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }

            let completedCount = 0;

            tasks.forEach(task => {
                if (task.completed) completedCount++;

                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3.5 rounded-xl border transition-all ${
                    task.completed 
                    ? 'bg-slate-800/40 border-slate-800 text-slate-500 line-through' 
                    : 'bg-slate-800 border-slate-700/60 text-slate-200'
                }`;

                li.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask(${task.id})">
                        <div class="w-5 h-5 rounded-lg border flex items-center justify-center transition-all ${
                            task.completed ? 'bg-orange-500 border-orange-500 text-white' : 'border-slate-600'
                        }">
                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>
                        <span class="text-sm font-medium break-all">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-500 hover:text-red-400 p-1.5 transition-colors">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                taskList.appendChild(li);
            });

            totalTasksSpan.textContent = tasks.length;
            completedTasksSpan.textContent = completedCount;
        }
    </script>
</body>
</html>
